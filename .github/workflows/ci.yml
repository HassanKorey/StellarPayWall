name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Run Soroban contract unit tests
      run: cargo test --manifest-path contracts/paywall_vault/Cargo.toml

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run linting (ruff)
      run: ruff check .

    - name: Run pytest with coverage
      run: pytest --cov=stellarpaywall --cov-report=xml --cov-fail-under=90
